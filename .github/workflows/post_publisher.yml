name: AI Social Post Publisher (Worker Handover Backend)

on:
  workflow_dispatch:
    inputs:
      product_id:
        description: 'D1 প্রোডাক্ট আইডি (Cloudflare Worker থেকে স্বয়ংক্রিয়ভাবে হ্যান্ডওভার হয়)'
        required: false
        type: string
        default: ''
      product_url:
        description: 'প্রোডাক্ট লিংক (ঐচ্ছিক)'
        required: false
        type: string
        default: ''
      target_platform:
        description: 'পোস্ট করার প্ল্যাটফর্ম (facebook / tiktok / telegram / all)'
        required: false
        type: choice
        options:
          - facebook
          - tiktok
          - telegram
          - all
        default: facebook
      post_type:
        description: 'পোস্ট ফরম্যাট (standard = সব ছবি সহ পোস্ট, caption_only = শুধুমাত্র টেক্সট ক্যাপশন)'
        required: false
        type: choice
        options:
          - standard
          - caption_only
        default: standard

jobs:
  publish-ai-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Execute Cloudflare Worker Handover Job
        run: node scripts/publish_posts.js
        env:
          WORKER_URL: 'https://social-automate.rifatrabbi104.workers.dev'
          PRODUCT_ID: ${{ inputs.product_id || '' }}
          PRODUCT_URL: ${{ inputs.product_url || '' }}
          TARGET_PLATFORM: ${{ inputs.target_platform || 'facebook' }}
          POST_TYPE: ${{ inputs.post_type || 'standard' }}
