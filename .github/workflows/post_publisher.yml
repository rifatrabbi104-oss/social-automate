name: AI Social Post Publisher

on:
  schedule:
    # প্রতিদিন সকাল ১০টা এবং রাত ৮টায় স্বয়ংক্রিয়ভাবে পোস্ট হবে (বাংলাদেশ সময়: UTC 04:00 & 14:00)
    - cron: '0 4,14 * * *'

  workflow_dispatch:
    inputs:
      product_url:
        description: 'আপনার ওয়েবসাইটের প্রোডাক্ট লিংক (ঐচ্ছিক - দিলে সরাসরি ওই প্রোডাক্টের ছবি ও ডিটেইলস নিয়ে পোস্ট হবে)'
        required: false
        type: string
        default: ''
      target_platform:
        description: 'পোস্ট করার প্ল্যাটফর্ম (tiktok / all / facebook / telegram)'
        required: false
        type: choice
        options:
          - all
          - tiktok
          - facebook
          - telegram
        default: facebook
      post_type:
        description: 'পোস্ট ফরম্যাট (caption_only = শুধুমাত্র টেক্সট ক্যাপশন, standard = ছবি সহ পোস্ট)'
        required: false
        type: choice
        options:
          - caption_only
          - standard
        default: caption_only

jobs:
  publish-ai-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate & Publish Social Post
        run: node scripts/publish_posts.js
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'models/gemini-3.8-live' }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          TIKTOK_CREATOR_ID: ${{ secrets.TIKTOK_CREATOR_ID }}
          META_PAGE_ACCESS_TOKEN: ${{ secrets.META_PAGE_ACCESS_TOKEN }}
          META_PAGE_ID: ${{ secrets.META_PAGE_ID || '1287050647827199' }}
          TARGET_PLATFORM: ${{ inputs.target_platform || 'facebook' }}
          POST_TYPE: ${{ inputs.post_type || 'caption_only' }}
          PRODUCT_URL: ${{ inputs.product_url }}
          WORKER_URL: 'https://social-automate.rifatrabbi104.workers.dev'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
